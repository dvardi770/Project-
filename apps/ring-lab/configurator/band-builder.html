<title>Band Builder</title>
<meta name="description" content="Design a pair of wedding bands in live 3D: profile, width, shape, metals, finishes, diamonds and engraving.">
<style>
  :root {
    --bg: #ffffff; --ink: #1d1c1a; --muted: #6f6a64; --faint: #a39d96; --line: #e9e5df; --chip: #f6f4f1;
    --accent: #a9874f; --accent-soft: #f5efe5; --stage: #ffffff; --focus: #1d1c1a; --card: #faf7f2;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151514; --ink: #f1eee9; --muted: #b3ada5; --faint: #8a847c; --line: #2c2a27; --chip: #201f1d;
      --accent: #d4b07a; --accent-soft: #2a241b; --stage: #1b1b1a; --focus: #f1eee9; --card: #1d1c1a; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #151514; --ink: #f1eee9; --muted: #b3ada5; --faint: #8a847c; --line: #2c2a27; --chip: #201f1d;
    --accent: #d4b07a; --accent-soft: #2a241b; --stage: #1b1b1a; --focus: #f1eee9; --card: #1d1c1a; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  /* On phones the strip under the status bar keeps the page's colour while content scrolls under it. */
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
  body { font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  button, input, select { font: inherit; color: inherit; }
  .app > * { min-width: 0; }
  .app { --stage-h: clamp(180px, 34vh, 440px); min-height: 100vh; min-height: 100dvh; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto auto 1fr auto auto; }
  .bar { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--bg); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 7; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; }
  .brand small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; letter-spacing: .04em; }
  .round-btn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg); display: grid; place-items: center; cursor: pointer; }
  .stage-wrap { position: sticky; top: calc(61px + env(safe-area-inset-top, 0px)); z-index: 5; background: var(--stage); height: var(--stage-h); }
  @supports (height: 1svh) { .app { --stage-h: clamp(180px, 34svh, 440px); } }
  #stage { position: absolute; inset: 0; }
  .tools { position: absolute; right: 12px; top: 12px; display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .tool { width: 36px; height: 36px; border-radius: 50%; border: 0; background: transparent; display: grid; place-items: center; cursor: pointer; color: var(--ink); }
  .tool:hover { background: var(--chip); }
  .zoom { writing-mode: vertical-lr; direction: rtl; width: 22px; height: 110px; accent-color: var(--accent); }
  .settings { position: absolute; right: 56px; top: 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; box-shadow: 0 6px 24px rgba(0,0,0,.08); font-size: 13px; width: 220px; }
  .settings[hidden] { display: none; }
  .settings h3 { margin: 0 0 6px; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .settings .row { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); background: var(--stage); transition: opacity .4s; }
  .loading[hidden] { display: grid; opacity: 0; pointer-events: none; }
  .tabs { position: sticky; top: calc(61px + var(--stage-h) + env(safe-area-inset-top, 0px)); z-index: 5; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--bg); }
  .tab { border: 0; background: none; padding: 13px 8px 11px; font-size: 15px; font-weight: 500; color: var(--faint); cursor: pointer; border-bottom: 2px solid transparent; }
  .tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
  .link { width: 44px; height: 34px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); display: grid; place-items: center; cursor: pointer; color: var(--muted); }
  .link[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .panel { padding: 14px 16px 22px; }
  .card { border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin: 0 0 12px; }
  .card h2 { margin: 0 0 10px; font: 400 17px/1.25 Georgia, "Times New Roman", serif; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .card h2 small { font: 400 12.5px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--muted); text-align: right; }
  .sub { margin-top: 12px; }
  .sub h3 { margin: 0 0 8px; font-size: 12.5px; font-weight: 500; color: var(--muted); }
  .muted { color: var(--muted); font-size: 12.5px; display: block; }
  .value { display: block; text-align: center; font-size: 14px; margin-bottom: 4px; }
  .value.big { font: 400 24px/1.1 Georgia, "Times New Roman", serif; }
  .width .readout { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; text-align: center; margin-bottom: 6px; }
  .nudge { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg); font-size: 22px; line-height: 1; color: var(--ink); cursor: pointer; }
  .nudge:active { background: var(--accent-soft); }
  .ruler { display: flex; justify-content: space-between; padding: 0 6px; font-size: 10.5px; color: var(--faint); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 5px 10px; font-size: 12.5px; color: var(--muted); cursor: pointer; }
  .chip i { width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); }
  .chip[aria-checked="true"] { border-color: var(--accent); color: var(--ink); background: var(--accent-soft); }
  .textrow { display: flex; align-items: center; gap: 8px; }
  .textrow small { color: var(--faint); font-size: 11.5px; flex: none; }
  .symbols { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .sym { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); font-size: 16px; cursor: pointer; color: var(--ink); }
  .fonts { display: grid; grid-template-columns: repeat(auto-fill, minmax(108px, 1fr)); gap: 8px; }
  .font { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 8px 6px; display: grid; gap: 2px; justify-items: center; cursor: pointer; color: var(--ink); overflow: hidden; }
  .font .sample { white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  .font small { color: var(--muted); font-size: 11px; }
  .font[aria-checked="true"] { border-color: var(--accent); background: var(--accent-soft); }
  .swatch i.none { background: repeating-linear-gradient(135deg, transparent 0 5px, var(--line) 5px 6px); }
  .preview { background: var(--card); border-radius: 12px; display: grid; place-items: center; padding: 14px; margin-bottom: 12px; color: var(--muted); font-size: 12.5px; gap: 6px; }
  .preview svg { width: 120px; height: 64px; }
  .choices { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 8px; }
  .choice { border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 8px 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; min-width: 0; color: var(--muted); font-size: 12px; text-align: center; line-height: 1.2; }
  .choice svg { width: 56px; height: 30px; }
  .choice[aria-checked="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); font-weight: 600; }
  .pills { display: flex; flex-wrap: wrap; gap: 8px; }
  .pill { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 7px 14px; font-size: 13px; cursor: pointer; color: var(--muted); }
  .pill[aria-checked="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); }
  .swatches { display: flex; gap: 14px; flex-wrap: wrap; }
  .swatch { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; font-size: 11.5px; color: var(--muted); }
  .swatch i { width: 34px; height: 34px; border-radius: 50%; display: block; box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); outline: 2px solid transparent; outline-offset: 3px; }
  .swatch[aria-checked="true"] i { outline-color: var(--accent); }
  .swatch[aria-checked="true"] { color: var(--ink); font-weight: 600; }
  .slider { margin-top: 4px; }
  .slider .badge { display: inline-block; border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; font-size: 13px; margin: 0 auto 6px; }
  .slider .ends { display: flex; justify-content: space-between; font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); }
  input[type="range"] { width: 100%; accent-color: var(--accent); }
  .toggle { display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: 13px; color: var(--muted); cursor: pointer; }
  .toggle input { width: 40px; height: 22px; accent-color: var(--accent); }
  select, input[type="text"] { width: 100%; height: 42px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); padding: 0 12px; }
  .note { color: var(--muted); font-size: 12.5px; margin: 8px 0 0; }
  .buy { position: sticky; bottom: 58px; z-index: 6; background: var(--bg); border-top: 1px solid var(--line); padding: 10px 16px; }
  .pair { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
  .pair small { display: block; font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); }
  .pair strong { font: 400 24px/1.1 Georgia, "Times New Roman", serif; }
  .pair span { color: var(--muted); font-size: 12.5px; margin-left: 6px; }
  .textlink { border: 0; background: none; padding: 0; color: var(--muted); text-decoration: underline; text-underline-offset: 2px; font-size: 12.5px; cursor: pointer; }
  .primary { width: 100%; border: 0; background: var(--ink); color: var(--bg); height: 46px; border-radius: 999px; letter-spacing: .12em; font-size: 12.5px; text-transform: uppercase; cursor: pointer; }
  .breakdown { font-size: 12.5px; margin: 0 0 8px; border-top: 1px dashed var(--line); padding-top: 6px; max-height: 30vh; max-height: 30svh; overflow-y: auto; overscroll-behavior: contain; }
  .breakdown div { display: flex; justify-content: space-between; gap: 10px; padding: 1px 0; }
  .breakdown div span:first-child { color: var(--muted); }
  .breakdown b { display: block; margin-top: 4px; font-weight: 600; }
  .steps { position: sticky; bottom: 0; z-index: 7; display: grid; grid-template-columns: repeat(4, 1fr); background: var(--bg); border-top: 1px solid var(--line); padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); }
  .step { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; color: var(--faint); cursor: pointer; padding: 2px; }
  .step i { width: 34px; height: 26px; border-radius: 8px; display: grid; place-items: center; font-style: normal; color: var(--faint); }
  .step[aria-current="step"] { color: var(--ink); font-weight: 600; }
  .step[aria-current="step"] i { background: var(--accent-soft); color: var(--accent); }
  .toast { position: fixed; left: 50%; bottom: 140px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-size: 14px; z-index: 9; opacity: 0; transition: opacity .25s; pointer-events: none; }
  .toast.show { opacity: 1; }
  /* Short phones: a slimmer price bar leaves more room for the choices. */
  @media (max-width: 959px) and (max-height: 760px) { .buy { padding: 6px 16px 8px; } .pair { margin-bottom: 6px; } #each { display: none; } .primary { height: 42px; } }
  .stats { position: absolute; left: 12px; top: 12px; font: 11px/1.3 ui-monospace, monospace; background: rgba(0,0,0,.62); color: #fff; padding: 4px 7px; border-radius: 4px; pointer-events: none; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .embed .bar { display: none; }
  .embed .stage-wrap { top: 0; }
  .embed .tabs { top: var(--stage-h); }
  /* The menu and the price bar: one scrolling area on phones; on wider screens they keep their own places. */
  .scroller { display: contents; }
  /* Phones, like a native app: the rings are pinned to the very top of the screen with nothing
     over them but small icon buttons; only the menu scrolls (the price and Continue at its end),
     and the steps stay at the bottom. The page itself never scrolls. */
  @media (max-width: 959px) {
    html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
    .app { --stage-h: clamp(200px, 34vh, 420px); box-sizing: border-box; height: 100vh; height: 100dvh; min-height: 0; padding-top: env(safe-area-inset-top, 0px); grid-template-rows: auto auto minmax(0, 1fr) auto; }
    @supports (height: 1svh) { .app { --stage-h: clamp(200px, 34svh, 420px); } }
    /* No logo or title: Share becomes the first of the icon buttons on the 3D. */
    .bar { grid-row: 1; grid-column: 1; justify-self: end; align-self: start; position: relative; top: auto; z-index: 8; padding: 10px 10px 0; background: transparent; border-bottom: 0; }
    .brand { display: none; }
    .round-btn { width: 36px; height: 36px; border: 0; background: transparent; }
    .stage-wrap { grid-row: 1; grid-column: 1; position: relative; top: auto; }
    .tools { top: 52px; gap: 6px; }
    .zoom { height: 76px; }
    .settings { top: 12px; }
    .embed .tools { top: 12px; }
    .tabs { grid-row: 2; position: relative; top: auto; }
    .scroller { display: block; grid-row: 3; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
    .buy { position: relative; bottom: auto; border-top: 0; padding-bottom: 16px; }
    .steps { grid-row: 4; position: relative; }
  }
  @media (min-width: 960px) {
    .app { grid-template-columns: minmax(0, 1fr) 460px; grid-template-rows: auto auto 1fr auto auto; }
    .bar { grid-column: 1 / -1; }
    .stage-wrap { grid-column: 1; grid-row: 2 / 6; height: calc(100vh - 61px); height: calc(100dvh - 61px); border-right: 1px solid var(--line); }
    .embed .stage-wrap { height: 100vh; height: 100dvh; }
    .tabs { grid-column: 2; grid-row: 2; top: 61px; }
    .embed .tabs { top: 0; }
    .panel { grid-column: 2; grid-row: 3; }
    .buy { grid-column: 2; grid-row: 4; }
    .steps { grid-column: 2; grid-row: 5; }
  }
  @media (prefers-reduced-motion: reduce) { .loading, .toast { transition: none; } }
</style>

<script type="module">
import { Stage, engravingMaps, engravingFontReady, ENGRAVING_FONTS } from './engine/stage.mjs';
import {
  buildBand, bandOptions, pairLayout, profilePoints, autoThickness, widthName, scatterLayout, PROFILES, BAND_SHAPES, PROPORTIONS, JOINS, GROOVES,
  EDGES, EDGE_SIDES, ARRANGEMENTS, SET_STYLES, SPANS, SPACINGS, TILTS, SCATTER_PATTERNS, SCATTER_TYPES, STONE_COLOURS, INNER_STONES,
  ENGRAVING_SIZES, SECTION_KEYS, EU_SIZES, DEFAULT_BAND,
} from './engine/band.mjs';
import { METALS, FINISHES, GEMS, diameterToUs, euToDiameter } from './engine/materials.mjs';
import { gemSwatch } from './engine/icons.mjs';
import * as icons from './engine/bandIcons.mjs';
import { priceBand, money } from './engine/pricing.mjs';

const params = new URLSearchParams(location.search);
if (params.has('embed')) document.documentElement.classList.add('embed');

const RINGS = { her: "Women's", his: "Men's" };
// Choices for each ring. Linked rings share the look (profile, metals, finishes, details); each
// keeps its own size, width, stones and inscription.
const PERSONAL = new Set(['size', 'width', 'thickness', 'autoThickness', 'arrangement', 'setStyle', 'stoneSize', 'stoneCount', 'span', 'spacing', 'tilt',
  'stonePosition', 'stoneAngle', 'stoneColour', 'scatterPattern', 'scatterRepeat', 'scatterCount', 'scatterType',
  'engraving', 'font', 'engravingSize', 'engravingAngle', 'innerStone']);
const state = {
  active: 'her', linked: true, step: 1, show: 'both', background: 'white', section: 0,
  her: { ...DEFAULT_BAND, width: 3.5, size: 52, sections: 2, metal: 'yellow', metal2: 'white', finish: 'polished', finish2: 'satin', arrangement: 'along', setStyle: 'pave', span: 'half', stoneSize: 1.1, stonePosition: -0.45 },
  his: { ...DEFAULT_BAND, width: 5.5, size: 60, sections: 2, metal: 'yellow', metal2: 'white', finish: 'polished', finish2: 'satin' },
};
// A shared link restores a design: #her=<json>&his=<json> (older links are translated).
try {
  const h = new URLSearchParams(location.hash.slice(1));
  for (const r of ['her', 'his']) if (h.get(r)) {
    const saved = JSON.parse(h.get(r));
    const base = { ...state[r] };
    // Older links name a layout and a diamond setting instead: let bandOptions translate them.
    if (saved.sections == null && saved.layout) delete base.sections;
    if (saved.arrangement == null && saved.setting) delete base.arrangement;
    Object.assign(state[r], bandOptions({ ...base, ...saved }));
  }
} catch { /* an old or edited link: keep the defaults */ }

  const total = prices.her.total + prices.his.total;
  document.getElementById('total').textContent = money(total);
  document.getElementById('each').textContent = `${RINGS.her} ${money(prices.her.total)} · ${RINGS.his} ${money(prices.his.total)}`;
  const bd = document.getElementById('breakdown');
  bd.replaceChildren(...['her', 'his'].flatMap((r) => [
    el('b', {}, `${RINGS[r]} ring · ${designs[r].specs.grams.toFixed(1)} g`),
    ...prices[r].lines.map((l) => el('div', {}, el('span', {}, l.label), el('span', {}, money(l.amount)))),
  ]));
}

let buildTimer = null;
function scheduleBuild(delay = 60, opts) {
  clearTimeout(buildTimer);
  buildTimer = setTimeout(() => { update(opts); }, delay);
}

function focusRing(r, view = 'ring') {
  const i = groupOf[r];
  if (i == null) { stage.focus('overview'); return; }
  const box = stage.groupBounds(i);
  const c = box.getCenter(box.min.clone());
  const yaw = state.show === 'both' ? (r === 'her' ? 28 : -38) : 0;
  if (view === 'inside') {
    const R = euToDiameter(state[r].size) / 2;
    stage.look({ target: [c.x, c.y - R * 0.62, c.z], polar: 36, azimuth: yaw, distance: R * 3.3 });
  } else {
    stage.look({ target: c, box, polar: 72, azimuth: yaw + 18, margin: 0.8 });
  }
}

function goStep(n) {
  state.step = n;
  update({ rebuild: false });
  if (n === 4) focusRing(state.active, 'inside');
  else if (n === 3) focusRing(state.active);
  else stage.focus('overview');
}

for (const t of document.querySelectorAll('.tab')) t.addEventListener('click', () => {
  state.active = t.dataset.ring;
  update({ rebuild: state.show !== 'both' });
  focusRing(state.active, state.step === 4 ? 'inside' : 'ring');
});
document.getElementById('link').addEventListener('click', () => {
  state.linked = !state.linked;
  // Linking copies the shared choices of the ring being designed onto the other one.
  if (state.linked) { const other = state.active === 'her' ? 'his' : 'her'; for (const k of Object.keys(DEFAULT_BAND)) if (!PERSONAL.has(k)) state[other][k] = ring()[k]; }
  update();
  toast(state.linked ? 'Both rings share their look' : 'Each ring is designed on its own');
});
document.getElementById('next').addEventListener('click', () => {
  if (state.step < 4) {
    goStep(state.step + 1);
    // Back to the top of the menu: on phones it scrolls by itself, on wider screens the page does.
    document.getElementById('scroller').scrollTo({ top: 0, behavior: 'smooth' });
    window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }
  const detail = { type: 'band-builder:add-to-cart', her: { design: state.her, specs: designs.her.specs, price: prices.her }, his: { design: state.his, specs: designs.his.specs, price: prices.his } };
  window.dispatchEvent(new CustomEvent('band-builder:add-to-cart', { detail }));
  if (window.parent !== window) window.parent.postMessage(detail, '*');
  toast('Your pair is in the cart');
});
const toggle = document.getElementById('toggle-breakdown');
toggle.addEventListener('click', () => {
  const bd = document.getElementById('breakdown');
  bd.hidden = !bd.hidden;
  toggle.setAttribute('aria-expanded', String(!bd.hidden));
  toggle.textContent = bd.hidden ? 'Price breakdown' : 'Hide breakdown';
});
document.getElementById('share').addEventListener('click', async () => {
  try {
    if (navigator.share) await navigator.share({ title: 'Our wedding bands', url: location.href });
    else { await navigator.clipboard.writeText(location.href); toast('Link copied'); }
  } catch { /* closed */ }
});
const toastEl = document.getElementById('toast');
function toast(text) { toastEl.textContent = text; toastEl.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => toastEl.classList.remove('show'), 2200); }

// Settings: which rings, background, turning.
const gear = document.getElementById('gear'), settings = document.getElementById('settings');
gear.addEventListener('click', () => { settings.hidden = !settings.hidden; gear.setAttribute('aria-expanded', String(!settings.hidden)); });
function renderSettings() {
  document.getElementById('show').replaceChildren(radios('pills', [['both', { label: 'Both rings' }], ['one', { label: 'This ring' }]], state.show, (v) => { state.show = v; renderSettings(); update(); stage.fit(); }, (v, i) => el('button', { class: 'pill' }, i.label)));
  document.getElementById('backgrounds').replaceChildren(radios('pills', Object.entries(BACKGROUNDS), state.background, (v) => { state.background = v; stage.setBackground(BACKGROUNDS[v].css); renderSettings(); }, (v, b) => el('button', { class: 'pill' }, b.label)));
}
document.getElementById('spin').addEventListener('change', (e) => stage.setAutoRotate(e.target.checked));
document.getElementById('reset').addEventListener('click', () => { document.getElementById('zoom').value = 50; stage.fit(); });
document.getElementById('zoom').addEventListener('input', (e) => stage.zoomTo(Number(e.target.value) / 100));

// ─── Start ──
let stage;
try {
  // The page itself does not scroll (only the menu does), so a drag on the 3D only turns the rings.
  // A soft studio: smooth reflections on the wide polished surfaces of bands.
  stage = new Stage(document.getElementById('stage'), { background: '#ffffff', rotateSpeed: 2.4, touchScroll: false, studio: 'soft' });
} catch (e) {
  document.getElementById('loading').textContent = 'This browser cannot show 3D. Try a recent Chrome, Safari or Firefox.';
  throw e;
}
renderSettings();
update();
requestAnimationFrame(() => requestAnimationFrame(() => { document.getElementById('loading').hidden = true; }));

if (params.has('stats')) {
  const box = document.createElement('div');
  box.className = 'stats';
  document.querySelector('.stage-wrap').append(box);
  setInterval(() => { const s = stage.stats; box.textContent = `${s.fps} fps · ${s.ms.toFixed(1)} ms · ${s.ratio}× · ${Math.round(s.triangles / 1000)}k tris · still ${s.samples}`; }, 500);
}

window.bandBuilder = {
  stage, state,
  get designs() { return designs; },
  get prices() { return prices; },
  set(ringName, o) { Object.assign(state[ringName], o); update(); },
  goStep, focusRing,
};
</script>
