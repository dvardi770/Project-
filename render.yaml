# Practice server on Render (render.com): New → Blueprint → this repository.
# Creates a database, the API (with the ring builder and the practice store) and the merchant dashboard.
# Steps in plain words: docs/practice-wordpress.md. Written for Render's Blueprint format; not yet tried
# on a Render account.
databases:
  - name: ring-builder-practice-db
    plan: free

services:
  - type: web
    name: ring-builder-api
    runtime: docker
    dockerfilePath: ./infra/docker/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ring-builder-practice-db
          property: connectionString
      - key: BUNDLE_SIGNING_SECRET
        generateValue: true
      - key: CREDENTIALS_ENCRYPTION_KEY
        generateValue: true
      # Your WordPress site, e.g. https://my-shop.com (turns practice mode on).
      - key: PRACTICE_SITE
        sync: false
      # Where the ring photos are: your Netlify site + /renders, e.g. https://my-rings.netlify.app/renders
      - key: RENDERS_PUBLIC_URL
        sync: false
      # WooCommerce connection (optional at first; needed for "Add to cart").
      - key: PRACTICE_WOO_KEY
        sync: false
      - key: PRACTICE_WOO_SECRET
        sync: false
      - key: PRACTICE_WOO_PRODUCT_ID
        sync: false
      - key: PRACTICE_WEBHOOK_SECRET
        sync: false

  - type: web
    name: ring-builder-dashboard
    runtime: docker
    dockerfilePath: ./infra/docker/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: ROLE
        value: dashboard
      - key: DATABASE_URL
        fromDatabase:
          name: ring-builder-practice-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: CREDENTIALS_ENCRYPTION_KEY
        fromService:
          type: web
          name: ring-builder-api
          envVarKey: CREDENTIALS_ENCRYPTION_KEY
      # This dashboard's own address, e.g. https://ring-builder-dashboard.onrender.com
      - key: DASHBOARD_URL
        sync: false
